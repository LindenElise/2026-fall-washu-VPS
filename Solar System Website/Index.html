
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar_System</title>
    <style>
        html { background: black; }
        body { margin: 0; }
        img { max-width: 100%; }

          #starfield {
          position: fixed;
          inset: 0;
          overflow: hidden;
          pointer-events: none;
          z-index: 0;
          }

          .star {
              position: absolute;
              border-radius: 50%;
              background: white;
          }

          .container{
            position: relative;
            max-width: 2000px;
            max-height: fit-content;
            margin: auto;
            z-index: 0;
        
          }

          .main_img {
            z-index: 0;
          }

           @keyframes spin{
                from{ transform: rotate(0deg); }
                to {transform: rotate(360deg); }
            }

          .game{
            position: absolute;
            top: 21%;
            left: 60%;
            pointer-events: none;

            animation-name: spin; 
            animation-duration: 20s; 
            animation-iteration-count: infinite;
            animation-timing-function: linear;

            z-index: 1;

          }

          .movie{
            position: absolute;
            top: -25%;
            left: 26%;
            pointer-events: none;

            animation-name: spin; 
            animation-duration: 20s; 
            animation-iteration-count: infinite;
            animation-timing-function: linear;

            z-index: 1;
          }

          .art{
            position: absolute;
            top: 50%;
            left: -5%;
            pointer-events: none;

            animation-name: spin; 
            animation-duration: 50s; 
            animation-iteration-count: infinite;
            animation-timing-function: linear;

            z-index: 2;
          }

          .book{
            position: absolute;
            top: 37%;
            left: 19%;
            pointer-events: none;

            animation-name: spin; 
            animation-duration: 5s; 
            animation-iteration-count: infinite;
            animation-timing-function: linear;


            z-index: 0;
          }
            .music{

            position: absolute;
            top: 77%;
            left: 84%;
            pointer-events: none;

            animation-name: spin; 
            animation-duration: 5s; 
            animation-iteration-count: infinite;
            animation-timing-function: linear;


            z-index: 2;
            
            }


            .rings{
                position: absolute;
                top: 35%;
                left: 85%;
                transform: translateX(-50%);
                pointer-events: none;
            }
          
          .element {
            position: absolute;
            width: 15%;
            height: 22%;
        
            border-radius: 50%;
            background: black;
            opacity: 0.5;

            top: 50%;
            left: 22%;

            z-index: 1;
          }


          
    </style>
</head>
<body>
     <div id="starfield" aria-hidden="true"></div>
<!-- Image Map Generated by http://www.image-map.net/ -->
 <div class = "container">

    <div class="element"></div>

    <div class = "movie"; style="width: 35%; height: auto">
     <img src="movei_planet.PNG">
    </div>

     <div class = "game"; style="width: 17%; height: auto">
     <img src="game_planet.PNG">
    </div>
    
    <div class = "art"; style="width: 38%; height: auto" >
     <img src="art_planet.PNG">
    </div>

    <div class = "book"; style="width: 20%; height: auto">
     <img src="book_planet.PNG">
    </div>

    <div class="music"; style="width: 3%; height: auto">
        <img src="music_planet.png">
    </div>

    <div class="rings"; style="width: 60%; height: auto">
        <img src="music_rings.png">
    </div>

    
    <div class = "main_img">
        <img src="overlay_planet.PNG" usemap="#image-map">
    </div>

    <map name="image-map">
        <area target="_self" alt="art planet" title="art planet" href="art4.html" coords="352,1362,471" shape="circle">
        <area target="_self" alt="book planet" title="book planet" href="book.html" coords="806,624,891,664,938,731,965,835,933,969,882,1028,797,1066,734,1066,646,987,521,920,496,848,514,738,583,660,689,608" shape="poly">
        <area target="_self" alt="games planet" title="games planet" href="games.html" coords="1750,568,273" shape="circle">
        <area target="_self" alt="music planet" title="music planet" href="music.html" coords="1436,1640,1658,1340,1871,1111,2058,952,2378,772,2538,709,2536,1631" shape="poly">
        <area target="_self" alt="movie planet" title="movie planet" href="movie.html" coords="1117,31,421" shape="circle">
    </map>
</div>
</body>

 <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script> 
<script src="jquery.rwdImageMaps.min.js"></script>
<script>
    $(document).ready(function() {
        $('img[usemap]').rwdImageMaps();
    });
</script>
<script>
  const starfield = document.getElementById("starfield");

    for (let i = 0; i < 150; i++) {
        const star = document.createElement("span");
        const size = Math.random() * 2 + 1;

        star.className = "star";
        star.style.left = `${Math.random() * 100}%`;
        star.style.top = `${Math.random() * 100}%`;
        star.style.width = `${size}px`;
        star.style.height = `${size}px`;
        star.style.opacity = Math.random();

        starfield.appendChild(star);
    }
</script>
</html>
